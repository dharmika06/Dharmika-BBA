name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: reference-portfolio/Portfolio_series-main/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: reference-portfolio/Portfolio_series-main

      - name: Build portfolio
        run: npm run build
        working-directory: reference-portfolio/Portfolio_series-main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: reference-portfolio/Portfolio_series-main/dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4